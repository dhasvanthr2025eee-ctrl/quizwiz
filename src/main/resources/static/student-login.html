
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizWiz - Student Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
        }

        .card {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            border-radius: 15px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #0072ff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
            font-weight: bold;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .register a {
            color: #0072ff;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">Q</div>

    <h1>Student Login</h1>

    <p class="subtitle">
        Login to your QuizWiz account
    </p>

    <label for="email">
        Email Address
    </label>

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
    >

    <label for="password">
        Password
    </label>

    <input
        type="password"
        id="password"
        placeholder="Enter your password"
    >

    <button onclick="loginStudent()">
        Login
    </button>

    <p id="message"></p>

    <div class="register">
        Don't have an account?
        <a href="student-register.html">
            Register
        </a>
    </div>

</div>


<script>

async function loginStudent() {

    const email =
        document.getElementById("email")
        .value.trim();

    const password =
        document.getElementById("password")
        .value.trim();

    const message =
        document.getElementById("message");


    if (email === "" || password === "") {

        message.style.color = "red";

        message.innerText =
            "Please enter email and password.";

        return;
    }


    try {

        const response = await fetch(
            "/api/students/login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );


        if (!response.ok) {

            const error =
                await response.text();

            message.style.color = "red";

            message.innerText =
                error ||
                "Invalid email or password.";

            return;
        }


        const student =
            await response.json();


        // Store student information
        sessionStorage.setItem(
            "studentId",
            student.id
        );

        sessionStorage.setItem(
            "studentName",
            student.name
        );

        sessionStorage.setItem(
            "studentEmail",
            student.email
        );

        sessionStorage.setItem(
            "registerNumber",
            student.registerNumber
        );


        message.style.color = "green";

        message.innerText =
            "Login successful!";


        setTimeout(function() {

            window.location.href =
                "student.html";

        }, 500);

    }
    catch (error) {

        console.error(error);

        message.style.color = "red";

        message.innerText =
            "Cannot connect to server.";

    }
}

</script>

</body>
</html>
