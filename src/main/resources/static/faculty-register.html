
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizWiz - Faculty Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .card {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            border-radius: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
            font-weight: bold;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login a {
            color: #667eea;
            font-weight: bold;
            text-decoration: none;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">Q</div>

    <h1>Faculty Registration</h1>

    <p class="subtitle">
        Create your QuizWiz faculty account
    </p>

    <label for="name">Faculty Name</label>
    <input
        type="text"
        id="name"
        placeholder="Enter faculty name"
    >

    <label for="email">Email Address</label>
    <input
        type="email"
        id="email"
        placeholder="Enter email address"
    >

    <label for="password">Password</label>
    <input
        type="password"
        id="password"
        placeholder="Enter password"
    >

    <button onclick="registerFaculty()">
        Create Account
    </button>

    <p id="message"></p>

    <div class="login">
        Already have an account?
        <a href="faculty-login.html">Login</a>
    </div>

    <div class="footer">
        QuizWiz - Online Quiz Conducting System
    </div>

</div>


<script>

async function registerFaculty() {

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value.trim();

    const message =
        document.getElementById("message");


    // Check empty fields
    if (name === "" ||
        email === "" ||
        password === "") {

        message.style.color = "red";
        message.innerText =
            "Please fill all fields.";

        return;
    }


    try {

        const response = await fetch(
            "/api/faculty/register",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password
                })
            }
        );


        if (response.ok) {

            message.style.color = "green";

            message.innerText =
                "Registration successful!";

            setTimeout(function() {

                window.location.href =
                    "faculty-login.html";

            }, 1000);

        } else {

            const error =
                await response.text();

            message.style.color = "red";

            message.innerText =
                error || "Registration failed.";

        }

    } catch (error) {

        console.error(error);

        message.style.color = "red";

        message.innerText =
            "Server is not running. Start Spring Boot.";

    }

}

</script>

</body>
</html>
