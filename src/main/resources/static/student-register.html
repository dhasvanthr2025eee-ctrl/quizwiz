
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizWiz - Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .card {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;

            border-radius: 15px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 8px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
            font-weight: bold;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login a {
            color: #667eea;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">Q</div>

    <h1>Student Registration</h1>

    <p class="subtitle">
        Create your QuizWiz student account
    </p>

    <label for="name">
        Student Name
    </label>

    <input
        type="text"
        id="name"
        placeholder="Enter your name"
    >

    <label for="registerNumber">
        Register Number
    </label>

    <input
        type="text"
        id="registerNumber"
        placeholder="Enter register number"
    >

    <label for="email">
        Email Address
    </label>

    <input
        type="email"
        id="email"
        placeholder="Enter email address"
    >

    <label for="password">
        Password
    </label>

    <input
        type="password"
        id="password"
        placeholder="Create a password"
    >

    <label for="confirmPassword">
        Confirm Password
    </label>

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
    >

    <button onclick="registerStudent()">
        Create Student Account
    </button>

    <p id="message"></p>

    <div class="login">
        Already have an account?
        <a href="student-login.html">
            Login
        </a>
    </div>

</div>


<script>

async function registerStudent() {

    const name =
        document.getElementById("name").value.trim();

    const registerNumber =
        document.getElementById("registerNumber")
        .value.trim();

    const email =
        document.getElementById("email")
        .value.trim();

    const password =
        document.getElementById("password")
        .value.trim();

    const confirmPassword =
        document.getElementById("confirmPassword")
        .value.trim();

    const message =
        document.getElementById("message");


    // Check empty fields

    if (
        name === "" ||
        registerNumber === "" ||
        email === "" ||
        password === "" ||
        confirmPassword === ""
    ) {

        message.style.color = "red";

        message.innerText =
            "Please fill all fields.";

        return;
    }


    // Check password

    if (password.length < 6) {

        message.style.color = "red";

        message.innerText =
            "Password must contain at least 6 characters.";

        return;
    }


    // Check confirm password

    if (password !== confirmPassword) {

        message.style.color = "red";

        message.innerText =
            "Passwords do not match.";

        return;
    }


    try {

        const response = await fetch(
            "/api/students",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    name: name,

                    registerNumber:
                        registerNumber,

                    email: email,

                    password: password

                })
            }
        );


        if (response.ok) {

            const student =
                await response.json();

            message.style.color = "green";

            message.innerText =
                "Registration successful!";

            setTimeout(function() {

                window.location.href =
                    "student-login.html";

            }, 1000);

        } else {

            const error =
                await response.text();

            message.style.color = "red";

            message.innerText =
                error ||
                "Registration failed.";

        }

    } catch (error) {

        console.error(error);

        message.style.color = "red";

        message.innerText =
            "Cannot connect to server.";

    }
}

</script>

</body>
</html>
